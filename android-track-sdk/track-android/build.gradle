apply plugin: 'com.android.library'

android {
    namespace 'com.ailife.track'
    compileSdk 34
    defaultConfig {
        minSdk 21
        consumerProguardFiles 'consumer-rules.pro'
    }
    buildFeatures {
        buildConfig false
    }
    // AIDL sources live in src/main/aidl (ITrackService, ITrackCallback)
}

dependencies {
    api project(':track-api')
    api project(':track-core')
    api project(':track-hub')
}
